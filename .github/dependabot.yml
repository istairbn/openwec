version: 2
updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  groups:
    rust:
      patterns:
        - "*"
- package-ecosystem: "github-actions"
  directory: "/"
  target-branch: "main"
  schedule:
    interval: "weekly"
  groups:
    actions:
      patterns:
        - "*"
